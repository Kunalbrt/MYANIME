<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Watch Anime</title>
  <style>
    body { background: #0f0f0f; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    #playerWrapper { width: 100%; max-width: 900px; margin: 0 auto; }
    #playBtn {
      display: block; width: 100%; padding: 16px;
      background: #e50914; color: white; font-size: 18px;
      border: none; border-radius: 8px; cursor: pointer;
    }
    #playBtn:hover { background: #c40812; }
    #playerContainer { display: none; margin-top: 16px; }
    #status { margin-top: 10px; color: #aaa; font-size: 14px; text-align: center; }

    /* ── Custom Player Shell ──────────────────────────────── */
    #videoShell {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      user-select: none;
    }
    #hlsPlayer {
      width: 100%;
      height: 500px;
      display: none;
      background: black;
    }
    /* Hide native controls — we use our own */
    #hlsPlayer::-webkit-media-controls { display: none !important; }

    #iframePlayer {
      display: none;
      width: 100%;
      height: 500px;
      border: none;
    }

    /* ── Controls bar ─────────────────────────────────────── */
    #controls {
      display: none; /* shown once video loads */
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 14px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      flex-direction: column;
      gap: 6px;
      transition: opacity 0.3s;
    }
    #videoShell:hover #controls,
    #videoShell.paused #controls { opacity: 1; }
    #videoShell.hide-controls #controls { opacity: 0; }

    /* Progress bar */
    #progressWrap {
      position: relative;
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      cursor: pointer;
      transition: height 0.15s;
    }
    #progressWrap:hover { height: 7px; }
    #progressBar {
      height: 100%;
      background: #e50914;
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      position: relative;
    }
    #progressBar::after {
      content: '';
      position: absolute;
      right: -5px; top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }
    #progressWrap:hover #progressBar::after { transform: translateY(-50%) scale(1); }

    /* Bottom row */
    #controlsRow {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: opacity 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { opacity: 1; transform: scale(1.12); }
    .ctrl-btn svg { width: 20px; height: 20px; fill: white; }

    #timeDisplay {
      font-size: 12px;
      color: #ccc;
      white-space: nowrap;
      margin-right: auto;
    }

    /* Volume */
    #volWrap { display: flex; align-items: center; gap: 6px; }
    #volSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 70px; height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #volSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }

    /* Episode nav */
    #episodeNav {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: flex-end;
    }
    .ep-btn {
      padding: 9px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .ep-btn:hover { transform: translateY(-1px); }
    #prevEpBtn {
      background: #2a2a2a;
      color: #ccc;
    }
    #prevEpBtn:hover { background: #3a3a3a; color: white; }
    #nextEpBtn {
      background: #e50914;
      color: white;
    }
    #nextEpBtn:hover { background: #c40812; }
    #epLabel {
      font-size: 13px;
      color: #888;
      margin-top: 8px;
      text-align: right;
    }

    /* Big play overlay */
    #bigPlayOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #bigPlayOverlay.show { opacity: 1; }
    #bigPlayOverlay svg {
      width: 72px; height: 72px;
      fill: rgba(255,255,255,0.8);
      filter: drop-shadow(0 0 12px rgba(0,0,0,0.7));
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
</head>
<body>

<div id="playerWrapper">
  <h2 id="animeTitle">Loading...</h2>
  <a href="/s-e/episode-player.html?id=ANIME_MONGO_ID">Watch</a>

  <!-- <button id="playBtn" onclick="loadPlayer()">▶ Watch Now</button> -->
  <div id="status"></div>

  <div id="playerContainer">

    <!-- Video shell with custom controls -->
    <div id="videoShell">
      <video id="hlsPlayer"></video>
      <iframe id="iframePlayer" allowfullscreen allow="autoplay; fullscreen"></iframe>

      <!-- Big play/pause flash -->
      <div id="bigPlayOverlay">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <!-- Custom controls (only for HLS video) -->
      <div id="controls">
        <div id="progressWrap">
          <div id="progressBar"></div>
        </div>
        <div id="controlsRow">
          <!-- Play/Pause -->
          <button class="ctrl-btn" id="playPauseBtn" title="Play/Pause">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <!-- Time -->
          <span id="timeDisplay">0:00 / 0:00</span>
          <!-- Volume -->
          <div id="volWrap">
            <button class="ctrl-btn" id="muteBtn" title="Mute">
              <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="muteIcon" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
          </div>
          <!-- Fullscreen -->
          <button class="ctrl-btn" id="fsBtn" title="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div><!-- /videoShell -->

    <!-- Episode navigation -->
    <div id="episodeNav">
      <button class="ep-btn" id="prevEpBtn">← Prev Episode</button>
      <button class="ep-btn" id="nextEpBtn">Next Episode →</button>
    </div>
    <p id="epLabel">Episode <span id="epNum">1</span></p>

  </div><!-- /playerContainer -->
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const ANIME_SLUG = params.get('slug') || 'naruto';
  let EPISODE_INDEX = parseInt(params.get('ep')) || 0;
  document.getElementById('animeTitle').innerText = ANIME_SLUG.replace(/-/g, ' ');

  // ── Episode label & nav ──────────────────────────────────────
  function updateEpLabel() {
    document.getElementById('epNum').innerText = EPISODE_INDEX + 1;
    document.getElementById('prevEpBtn').disabled = EPISODE_INDEX <= 0;
    document.getElementById('prevEpBtn').style.opacity = EPISODE_INDEX <= 0 ? '0.4' : '1';
  }
  updateEpLabel();

  document.getElementById('prevEpBtn').onclick = () => {
    if (EPISODE_INDEX > 0) { EPISODE_INDEX--; reloadPlayer(); }
  };
  document.getElementById('nextEpBtn').onclick = () => {
    EPISODE_INDEX++;
    reloadPlayer();
  };

  function reloadPlayer() {
    updateEpLabel();
    const container = document.getElementById('playerContainer');
    container.style.display = 'none';
    document.getElementById('hlsPlayer').style.display = 'none';
    document.getElementById('iframePlayer').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    loadPlayer();
  }

  // ── Main loader (your original logic — untouched) ────────────
  async function loadPlayer() {
    const status = document.getElementById('status');
    status.innerText = 'Fetching stream URL...';

    try {
      const res = await fetch(`https://myanime-backend-2vc9.onrender.com/api/stream/${ANIME_SLUG}/${EPISODE_INDEX}`);
      const data = await res.json();

      if (!data.success) throw new Error('Stream fetch failed');

      document.getElementById('playerContainer').style.display = 'block';
      status.innerText = '';

      if (data.type === 'm3u8') {
        const video = document.getElementById('hlsPlayer');
        video.style.display = 'block';
        document.getElementById('controls').style.display = 'flex';
        initControls(video);

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(data.url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = data.url;
          video.play();
        }
      } else {
        const iframe = document.getElementById('iframePlayer');
        iframe.style.display = 'block';
        iframe.style.width = '100%';
        iframe.style.height = '500px';
        iframe.style.border = 'none';
        iframe.src = data.url;
      }

    } catch (err) {
      status.innerText = '❌ Failed to load stream. Try again.';
      console.error(err);
    }
  }

  // ── Custom controls logic ────────────────────────────────────
  function initControls(video) {
    const shell        = document.getElementById('videoShell');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon     = document.getElementById('playIcon');
    const pauseIcon    = document.getElementById('pauseIcon');
    const progressBar  = document.getElementById('progressBar');
    const progressWrap = document.getElementById('progressWrap');
    const timeDisplay  = document.getElementById('timeDisplay');
    const volSlider    = document.getElementById('volSlider');
    const muteBtn      = document.getElementById('muteBtn');
    const volIcon      = document.getElementById('volIcon');
    const muteIcon     = document.getElementById('muteIcon');
    const fsBtn        = document.getElementById('fsBtn');
    const bigOverlay   = document.getElementById('bigPlayOverlay');

    function fmt(s) {
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    // Play/Pause toggle
    function togglePlay() {
      if (video.paused) { video.play(); } else { video.pause(); }
      flashOverlay();
    }
    video.addEventListener('play',  () => { playIcon.style.display='none'; pauseIcon.style.display='block'; shell.classList.remove('paused'); });
    video.addEventListener('pause', () => { playIcon.style.display='block'; pauseIcon.style.display='none'; shell.classList.add('paused'); });
    playPauseBtn.onclick = togglePlay;
    video.onclick = togglePlay;

    function flashOverlay() {
      bigOverlay.classList.add('show');
      clearTimeout(bigOverlay._t);
      bigOverlay._t = setTimeout(() => bigOverlay.classList.remove('show'), 500);
      // swap icon to reflect action
      bigOverlay.querySelector('svg path').setAttribute('d',
        video.paused ? 'M8 5v14l11-7z' : 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'
      );
    }

    // Progress
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      const pct = (video.currentTime / video.duration) * 100;
      progressBar.style.width = pct + '%';
      timeDisplay.innerText = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
    });
    progressWrap.addEventListener('click', e => {
      const rect = progressWrap.getBoundingClientRect();
      video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
    });

    // Volume
    volSlider.addEventListener('input', () => {
      video.volume = volSlider.value;
      video.muted  = volSlider.value == 0;
      updateVolIcon();
    });
    muteBtn.onclick = () => {
      video.muted = !video.muted;
      volSlider.value = video.muted ? 0 : video.volume;
      updateVolIcon();
    };
    function updateVolIcon() {
      const muted = video.muted || video.volume == 0;
      volIcon.style.display  = muted ? 'none'  : 'block';
      muteIcon.style.display = muted ? 'block' : 'none';
    }

    // Fullscreen
    fsBtn.onclick = () => {
      if (!document.fullscreenElement) shell.requestFullscreen();
      else document.exitFullscreen();
    };
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowRight') video.currentTime += 10;
      if (e.code === 'ArrowLeft')  video.currentTime -= 10;
      if (e.code === 'ArrowUp')    { video.volume = Math.min(1, video.volume + 0.1); volSlider.value = video.volume; }
      if (e.code === 'ArrowDown')  { video.volume = Math.max(0, video.volume - 0.1); volSlider.value = video.volume; }
    });

    // Auto-hide controls after 3s of no movement
    let hideTimer;
    shell.addEventListener('mousemove', () => {
      shell.classList.remove('hide-controls');
      clearTimeout(hideTimer);
      if (!video.paused) hideTimer = setTimeout(() => shell.classList.add('hide-controls'), 3000);
    });
    shell.addEventListener('mouseleave', () => {
      if (!video.paused) shell.classList.add('hide-controls');
    });
  }

  // Auto-load on page open
  loadPlayer();
</script>

</body>
</html>
